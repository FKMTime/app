services:
  database:
    image: postgres:16
    container_name: fkmtime-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fkmtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-fkmtime}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fkmtime} -d ${POSTGRES_DB:-fkmtime}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fkmtime-app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fkmtime}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-fkmtime}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be set}
      AUTH_TRUST_HOST: "true"
      WCA_CLIENT_ID: ${WCA_CLIENT_ID:?WCA_CLIENT_ID must be set}
      WCA_CLIENT_SECRET: ${WCA_CLIENT_SECRET:?WCA_CLIENT_SECRET must be set}
      WCA_ORIGIN: ${WCA_ORIGIN:-https://www.worldcubeassociation.org}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: fkmtime-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set (e.g. fkmtime.example.com)}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  database:
  caddy_data:
  caddy_config:
